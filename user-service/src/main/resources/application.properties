# ------------------------------------------------------------------------------
#                             Application settings
# ------------------------------------------------------------------------------
server.port=8081
spring.application.name=user-service
spring.profiles.active=${ENVIRONMENT:dev}


# ------------------------------------------------------------------------------
#                            Database configuration
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:tableit_db}
spring.jpa.properties.hibernate.default_schema=user_schema
spring.datasource.username=${DB_USER:tableit}
spring.datasource.password=${DB_PASSWORD:tableit}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
#                            Flyway configuration
# ------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.default-schema=user_schema
spring.flyway.schemas=user_schema
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration


# ------------------------------------------------------------------------------
#                                   Logging
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.tableit=DEBUG
logging.file.name=logs/app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
