# ------------------------------------------------------------------------------
#                             Application settings
# ------------------------------------------------------------------------------
server.port=8080
spring.application.name=tableit
spring.profiles.active=${ENVIRONMENT:dev}


# ------------------------------------------------------------------------------
#                            Database configuration
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tableit_db}
currentSchema=auth_schema
spring.datasource.username=${DB_USER:tableit}
spring.datasource.password=${DB_PASSWORD:tableit}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true


# ------------------------------------------------------------------------------
#                            Flyway configuration
# ------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.default-schema=auth_schema
spring.flyway.schemas=auth_schema
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration


# ------------------------------------------------------------------------------
#                                   Logging
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.paltsy=DEBUG
logging.file.name=logs/app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


# ------------------------------------------------------------------------------
#                              External services
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
#                              JWT KEYS
# ------------------------------------------------------------------------------

# Access Token RSA Keys (Base64 encoded)
jwt.private-key.access=${PRIVATE_ACCESS_KEY}
jwt.public-key.access=${PUBLIC_ACCESS_KEY}

# Refresh Token RSA Keys (Base64 encoded)
jwt.private-key.refresh=${PRIVATE_REFRESH_KEY}
jwt.public-key.refresh=${PUBLIC_REFRESH_KEY}


# ================= JWT EXPIRATION =================

# access token: 15 minutes
jwt.expiration.access-ms=900000

# refresh token: 7 days
jwt.expiration.refresh-ms=604800000

# action token ttl: 5 minutes
action-token.expiration-ms=300000

