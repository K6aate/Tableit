version: "3.8"

services:
  postgres:
    image: postgres:18
    container_name: tableit-postgres
    environment:
      POSTGRES_DB: tableit_db
      POSTGRES_USER: tableit
      POSTGRES_PASSWORD: tableit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: