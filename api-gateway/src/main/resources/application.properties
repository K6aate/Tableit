# ------------------------------------------------------------------------------
#                             Application settings
# ------------------------------------------------------------------------------
server.port=8083
spring.application.name=api-gateway
spring.profiles.active=${ENVIRONMENT:dev}


# Auth Service
spring.cloud.gateway.server.webflux.routes[3].id=auth-service
spring.cloud.gateway.server.webflux.routes[3].uri=${AUTH_SERVICE_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/auth/**


# User Service
spring.cloud.gateway.server.webflux.routes[4].id=user-service
spring.cloud.gateway.server.webflux.routes[4].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/users/**


# Matching Service
spring.cloud.gateway.server.webflux.routes[5].id=matching-service
spring.cloud.gateway.server.webflux.routes[5].uri=${MATCHING_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/matching/**



# Actuator
management.endpoints.web.exposure.include=health,info


# ------------------------------------------------------------------------------
#                                   Logging
# ------------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.paltsy=DEBUG
logging.file.name=logs/app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


# ------------------------------------------------------------------------------
#                              Swagger
# ------------------------------------------------------------------------------
springdoc.swagger-ui.urls-primary-name=Auth Service

# Auth Service OpenAPI
spring.cloud.gateway.server.webflux.routes[0].id=auth-service-docs
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/v3/api-docs
spring.cloud.gateway.server.webflux.routes[0].filters[0]=SetPath=/v3/api-docs
springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/api/auth/v3/api-docs


# User Service OpenAPI
spring.cloud.gateway.server.webflux.routes[1].id=user-service-docs
spring.cloud.gateway.server.webflux.routes[1].uri=${USER_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/v3/api-docs
spring.cloud.gateway.server.webflux.routes[1].filters[0]=SetPath=/v3/api-docs
springdoc.swagger-ui.urls[1].name=User Service
springdoc.swagger-ui.urls[1].url=/api/users/v3/api-docs

# Matching Service OpenAPI
spring.cloud.gateway.server.webflux.routes[2].id=matching-service-docs
spring.cloud.gateway.server.webflux.routes[2].uri=${MATCHING_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/matching/v3/api-docs
spring.cloud.gateway.server.webflux.routes[2].filters[0]=SetPath=/v3/api-docs
springdoc.swagger-ui.urls[2].name=Matching Service
springdoc.swagger-ui.urls[2].url=/api/matching/v3/api-docs

# ------------------------------------------------------------------------------
#                              JWT KEYS
# ------------------------------------------------------------------------------

# Access Token RSA Keys (Base64 encoded)
jwt.private-key.access=${PRIVATE_ACCESS_KEY}
jwt.public-key.access=${PUBLIC_ACCESS_KEY}

# Refresh Token RSA Keys (Base64 encoded)
jwt.private-key.refresh=${PRIVATE_REFRESH_KEY}
jwt.public-key.refresh=${PUBLIC_REFRESH_KEY}


# ================= JWT EXPIRATION =================

# access token: 15 minutes
jwt.expiration.access-ms=900000

# refresh token: 7 days
jwt.expiration.refresh-ms=604800000

# action token ttl: 5 minutes
action-token.expiration-ms=300000

